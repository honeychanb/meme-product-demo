 mount(`${header('Host data',{name:host.name,id:host.id,avatar:'🐱'})}<main class="submain"><section class="card subcard"><div class="seg three"><button>Today</button><button class="active">This Week</button><button>This Month</button></div><div class="datebar"><div>Date:<br><strong>2026.08.03–2026.08.09</strong></div><span>Please choose the date ›</span></div><div class="host-kpis"><div class="kpi wide"><span>Total Rev <i class="help">?</i></span><strong>🪙 ${fmt(host.regular+host.lucky)}</strong><div class="rows"><span>Regular Rev <i class="help">?</i></span><b>🪙 ${fmt(host.regular)}</b><span>Lucky Rev <i class="help">?</i></span><b>🪙 ${fmt(host.lucky)}</b></div></div><div class="kpi"><span>Valid Duration</span><strong>${host.valid.split('/')[0]}</strong></div><div class="kpi"><span>Live Duration</span><strong>${host.live}</strong></div><div class="kpi"><span>Gifters</span><strong>${host.gifters}</strong></div><div class="kpi"><span>Viewers</span><strong>${host.viewers}</strong></div><div class="kpi"><span>New Fans</span><strong>${host.fans}</strong></div><div class="kpi"><span>Active Users</span><strong>${host.active}</strong></div></div></section></main>`,backFn);
}
function inviteHeader(){
 return `<header class="invite-hero"><div class="appbar"><button class="round ghost" data-back>‹</button><div class="app-title">Invite</div><button class="invite-setting" type="button">⚙</button></div></header>`;
}
function directRoleLabel(role=currentRole){
 return role==='country'?'Country Manager':role==='manager'?'Manager':role==='super'?'Super Admin':'Admin';
}
function managerChoices(){
 return (managementRoles.Manager||[]).map(x=>({value:x.id,label:`${x.name} · ID:${x.id}`}));
}
function teamLeaderChoices(managerId=''){
 const manager=(managementRoles.Manager||[]).find(x=>x.id===managerId);
 const managerName=manager?manager.name:'';
 const out=[];
 (managementRoles['Super Admin']||[]).filter(x=>!managerName||x.managedBy===managerName).forEach(x=>out.push({value:`Super Admin|${x.id}`,label:`${x.name} · Super Admin · ID:${x.id}`}));
 (managementRoles.Admin||[]).filter(x=>!managerName||x.managedBy===managerName).forEach(x=>out.push({value:`Admin|${x.id}`,label:`${x.name} · Admin · ID:${x.id}`}));
 return out;
}
function currentManagerTeamLeaderChoices(){
 const managerName='Manager Mia';
 const out=[];
 getTeamLeaderRows('Super Admin',managerName).forEach(x=>out.push({value:`Super Admin|${x.id}`,label:`${x.name} · Super Admin · ID:${x.id}`}));
 getTeamLeaderRows('Admin',managerName).forEach(x=>out.push({value:`Admin|${x.id}`,label:`${x.name} · Admin · ID:${x.id}`}));
 return out;
}
function bdChoices(){
 return business.BD.map(x=>({value:x.id,label:`${x.name} · ID:${x.id}`}));
}
function teamLeaderFromValue(value=''){
 const [role,id]=String(value).split('|');
 const rows=role==='Super Admin'?(managementRoles['Super Admin']||[]):role==='Admin'?(managementRoles.Admin||[]):[];
 return rows.find(x=>x.id===id)||null;
}
function bdChoicesByTeamLeader(value=''){
 const leader=teamLeaderFromValue(value);
 if(!leader)return [];
 return business.BD.filter(x=>x.owner===leader.name).map(x=>({value:x.id,label:`${x.name} · ID:${x.id}`}));
}
function agencyChoices(bdId=''){
 const bd=business.BD.find(x=>x.id===bdId);
 const rows=bd?business.Agency.filter(x=>x.bd===bd.name):business.Agency;
 return rows.map(x=>({value:x.id,label:`${x.name} · ID:${x.id}`}));
}
function inviteAffiliations(type){
 // Mobile Invite follows the real organization path.
 // Direct child = enter Target Account ID only.
 // Cross-level recruitment = select every required intermediate affiliation in order.
 if(currentRole==='country'){
  if(type==='Manager')return [];
  if(type==='Super Admin'||type==='Admin')return [
   {key:'manager',label:'Affiliated Manager',values:managerChoices()}
  ];
  if(type==='BD')return [
   {key:'manager',label:'Affiliated Manager',values:managerChoices()},
   {key:'teamLeader',label:'Affiliated Super Admin / Admin',values:[]}
  ];
  if(type==='Agency')return [
   {key:'manager',label:'Affiliated Manager',values:managerChoices()},
   {key:'teamLeader',label:'Affiliated Super Admin / Admin',values:[]},
   {key:'bd',label:'Affiliated BD',values:[]}
  ];
  if(type==='Host')return [
   {key:'manager',label:'Affiliated Manager',values:managerChoices()},
   {key:'teamLeader',label:'Affiliated Super Admin / Admin',values:[]},
   {key:'bd',label:'Affiliated BD',values:[]},
   {key:'agency',label:'Affiliated Agency',values:[]}
  ];
 }
 // Manager can directly invite Super Admin / Admin only.
 // A new BD must be placed under a Super Admin / Admin; Manager Direct BD is retained only as legacy / role-change data.
 // Agency and Host continue to use the existing BD → Agency chain.
 if(currentRole==='manager'){
  if(type==='Super Admin'||type==='Admin')return [];
  if(type==='BD')return [
   {key:'teamLeader',label:'Affiliated Super Admin / Admin',values:currentManagerTeamLeaderChoices()}
  ];
  if(type==='Agency')return [{key:'bd',label:'Affiliated BD',values:bdChoices()}];
  if(type==='Host')return [
   {key:'bd',label:'Affiliated BD',values:bdChoices()},
   {key:'agency',label:'Affiliated Agency',values:[]}
  ];
 }
 // Super Admin / Admin can directly invite BD; lower business members follow the existing chain.
 if(currentRole==='super'||currentRole==='admin'){
  if(type==='BD')return [];
  if(type==='Agency')return [{key:'bd',label:'Affiliated BD',values:bdChoices()}];
  if(type==='Host')return [
   {key:'bd',label:'Affiliated BD',values:bdChoices()},
   {key:'agency',label:'Affiliated Agency',values:[]}
  ];
 }
 return [];
}
function inviteSelect(field){
 return `<div class="invite-field"><label class="invite-label">${field.label}</label><select class="invite-control invite-select" id="invite-${field.key}" required><option value="" selected disabled>Please select</option>${field.values.map(x=>`<option value="${x.value}">${x.label}</option>`).join('')}</select>${field.key==='agency'?'<div class="invite-cascade-note">Select an affiliated BD first to narrow the Agency list.</div>':''}</div>`;
}
function openRecruit(type,backFn=home){
 route={name:'recruit',type};
 const fields=inviteAffiliations(type);
 const direct=!fields.length;
 const context=direct
  ? `${type} will be directly affiliated with the current <strong>${directRoleLabel()}</strong>.`
  : currentRole==='country'
    ? `Select the affiliation path in order before inviting this <strong>${type}</strong>.`
    : currentRole==='manager'&&type==='BD'
      ? 'A new BD must be affiliated with a <strong>Super Admin / Admin</strong>. Manager Direct BD is not created through Invite.'
      : type==='Host'
        ? 'Affiliation follows the existing business chain: <strong>BD → Agency → Host</strong>.'
        : 'Select the required affiliation before sending the invitation.';
 mount(`${inviteHeader()}<main class="invite-main"><section class="invite-card"><div class="invite-context">${context}</div><div class="invite-field"><label class="invite-label">Target Account ID</label><input class="invite-control" id="recruitUid" inputmode="numeric" placeholder="Enter ${type} ID"></div>${fields.map(inviteSelect).join('')}</section><button class="invite-confirm" id="confirmRecruit">CONFIRM</button><section class="invite-guidelines"><h3>INVITATION GUIDELINES</h3><ul><li>Verify the MeMe ID to ensure you are inviting the correct user.</li><li>Only users with no valid active contract can be invited.</li><li>After the invitation is sent, the recipient needs to accept it in the MeMe App to complete the binding.</li><li>Earnings calculation takes effect immediately after the binding is confirmed.</li></ul></section></main>`,backFn);

 const managerSelect=document.getElementById('invite-manager');
 const teamLeaderSelect=document.getElementById('invite-teamLeader');
 const bdSelect=document.getElementById('invite-bd');
 const agencySelect=document.getElementById('invite-agency');

 const fillSelect=(el,values,placeholder='Please select')=>{
  if(!el)return;
  el.innerHTML=`<option value="" selected disabled>${placeholder}</option>${values.map(x=>`<option value="${x.value}">${x.label}</option>`).join('')}`;
 };
 const disableSelect=(el,placeholder)=>{
  if(!el)return;
  el.disabled=true;
  el.innerHTML=`<option value="" selected disabled>${placeholder}</option>`;
 };

 // Country Manager: Manager → Super Admin/Admin → BD → Agency cascades by target type.
 if(currentRole==='country'&&managerSelect&&teamLeaderSelect){
  disableSelect(teamLeaderSelect,'Please select Manager first');
  if(bdSelect)disableSelect(bdSelect,'Please select Super Admin / Admin first');
  if(agencySelect)disableSelect(agencySelect,'Please select BD first');
  managerSelect.onchange=()=>{
   const leaders=teamLeaderChoices(managerSelect.value);
   teamLeaderSelect.disabled=false;
   fillSelect(teamLeaderSelect,leaders);
   if(bdSelect)disableSelect(bdSelect,'Please select Super Admin / Admin first');
   if(agencySelect)disableSelect(agencySelect,'Please select BD first');
  };
  teamLeaderSelect.onchange=()=>{
   if(bdSelect){
    const bds=bdChoicesByTeamLeader(teamLeaderSelect.value);
    bdSelect.disabled=false;
    fillSelect(bdSelect,bds,bds.length?'Please select':'No BD available');
   }
   if(agencySelect)disableSelect(agencySelect,'Please select BD first');
  };
 }

 // Existing business chain: BD → Agency.
 if(bdSelect&&agencySelect){
  if(!(currentRole==='country'&&teamLeaderSelect))disableSelect(agencySelect,'Please select BD first');
  bdSelect.onchange=()=>{
   const values=agencyChoices(bdSelect.value);
   agencySelect.disabled=false;
   fillSelect(agencySelect,values,values.length?'Please select':'No Agency available');
  };
 }

 document.getElementById('confirmRecruit').onclick=()=>{
  const uid=document.getElementById('recruitUid').value.trim();
  if(!uid)return toast(`Please enter ${type} ID`);
  for(const f of fields){
   const el=document.getElementById(`invite-${f.key}`);
   if(!el||!el.value)return toast(`Please select ${f.label.replace('Affiliated ','')}`);
  }
  toast(`${type} invitation sent`);
  setTimeout(backFn,550);
 };
}

function openContentReview(backFn=home){
 route={name:'contentReview'};
 const items=[
  {type:'Profile',name:'Lina',id:'88201',item:'Nickname / Avatar',time:'10 min ago'},
  {type:'Room',name:'Royal Voice',id:'8740',item:'Room cover / Announcement',time:'24 min ago'}
 ];
 mount(`${header('Review',{badge:roleData[currentRole].badge})}<main class="submain"><section class="card subcard"><div class="seg three"><button class="active">Pending</button><button>Approved</button><button>Rejected</button></div><div class="notice" style="margin-top:12px">Review profile and room content submissions. Role promotion / demotion is handled by platform rules or operations and is not reviewed here.</div><div class="list">${items.map((x,i)=>`<div class="role-list-card"><div class="role-list-head"><div class="role-avatar">${x.type==='Profile'?'👤':'🏠'}</div><div><h3>${x.type} · ${x.name}</h3><div class="role-meta">ID:${x.id}<br>${x.item} · ${x.time}</div></div></div><div class="role-actions"><button class="mini-btn" data-reject-review>Reject</button><button class="mini-btn primary-mini" data-approve-review>Approve</button></div></div>`).join('')}</div></section></main>`,backFn);
 document.querySelectorAll('[data-approve-review]').forEach(b=>b.onclick=()=>toast('Review approved.'));
 document.querySelectorAll('[data-reject-review]').forEach(b=>b.onclick=()=>toast('Review rejected.'));
}
function openBenefits(backFn=home){
 route={name:'rights'};
 mount(`${header('Benefits',{badge:roleData[currentRole].badge})}<main class="submain"><section class="card subcard"><div class="notice" style="margin-bottom:12px">Benefits are business perks and rewards. They do not configure system role permissions.</div><div class="rights-grid"><div class="right"><div class="ico">🎁</div><h3>Welcome Gift</h3><p>Avatar Frame, Theme, Chat Bubble, Vehicle and other configured items.</p><button data-right="Welcome Gift">Issue</button></div><div class="right"><div class="ico">💎</div><h3>Unique ID</h3><p>Issue an eligible unique ID after quota and availability validation.</p><button data-right="Unique ID">Issue</button></div></div></section></main>`,backFn);document.querySelectorAll('[data-right]').forEach(b=>b.onclick=()=>toast(`${b.dataset.right} flow opened`));
}
function setRole(role){currentRole=role;period='today';route={name:'home'};document.querySelectorAll('.role-switch button').forEach(b=>b.classList.toggle('active',b.dataset.role===role));home()}
document.querySelectorAll('.role-switch button').forEach(b=>b.onclick=()=>setRole(b.dataset.role));
home();
</script>
